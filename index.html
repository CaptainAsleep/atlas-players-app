<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F2F2ED" />
    <script>
      // Paint the status bar in the player's equipped look before iOS reads
      // it (see useTheme.jsx). Must stay inline and right after theme-color.
      try {
        var c = localStorage.getItem("atlas-theme-bg");
        if (c && /^#[0-9a-fA-F]{3,8}$/.test(c)) {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
          document.documentElement.style.backgroundColor = c;
        }
      } catch (e) {}
    </script>
    <!-- iOS "Add to Home Screen" behavior needs these explicitly — it
         doesn't fully read the web manifest the way Android/Chrome does. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <title>Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
